<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Conviva Simulador</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: app de uma coluna (mobile primeiro), barra de abas no topo; cada aba é uma etapa do programa. Comparações abrem em colunas lado a lado. */
:root {
  --bg: #F4F6FA; --surface: #FFFFFF; --ink: #0F2440; --muted: #4F6178; --line: #D5DDE9;
  --brand: #163B6B; --brand-ink: #FFFFFF; --brand-soft: #DDE7F3;
  --acordo: #1C7A5A; --acordo-soft: #E2F2EA;
  --processo: #9A5B13; --processo-soft: #F6ECDD;
  --interno: #2F5E8C; --interno-soft: #E3ECF6;
  --alerta: #A3322B; --alerta-soft: #F8E4E2;
  --ouro: #A77B12; --focus: #2D6CDF;
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1626; --surface: #142238; --ink: #E8EEF7; --muted: #A6B4C9; --line: #2A3B57;
    --brand: #9DB9E6; --brand-ink: #0C1626; --brand-soft: #1C2F4D;
    --acordo: #6FD3A8; --acordo-soft: #173328; --processo: #E3A45C; --processo-soft: #33261A;
    --interno: #8FB8E8; --interno-soft: #1A2836; --alerta: #F08C83; --alerta-soft: #3A1E1C;
    --ouro: #E2BC5C; --focus: #8AB4FF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1626; --surface: #142238; --ink: #E8EEF7; --muted: #A6B4C9; --line: #2A3B57;
  --brand: #9DB9E6; --brand-ink: #0C1626; --brand-soft: #1C2F4D;
  --acordo: #6FD3A8; --acordo-soft: #173328; --processo: #E3A45C; --processo-soft: #33261A;
  --interno: #8FB8E8; --interno-soft: #1A2836; --alerta: #F08C83; --alerta-soft: #3A1E1C;
  --ouro: #E2BC5C; --focus: #8AB4FF; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; line-height: 1.2; }
h1 { font-size: clamp(1.5rem, 4vw, 2rem); }
h2 { font-size: 1.25rem; }
h3 { font-size: 1.02rem; }
p { margin: 0; max-width: 68ch; }
.lead { color: var(--muted); }
.hint { color: var(--muted); font-size: .9rem; }

header.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand svg { width: 42px; height: 42px; flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; line-height: 1.1; }
.brand-sub { color: var(--muted); font-size: .88rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font-size: .78rem; font-weight: 700; letter-spacing: .04em; padding: 6px 12px; border-radius: 999px; background: var(--brand-soft); color: var(--brand); }
.chip.demo { background: var(--processo-soft); color: var(--processo); text-transform: uppercase; }
.chip.ok { background: var(--acordo-soft); color: var(--acordo); }

.tabs-scroll { overflow-x: auto; }
nav.tabs { display: flex; gap: 6px; min-width: max-content; border-bottom: 2px solid var(--line); }
nav.tabs button {
  font: inherit; font-size: .95rem; background: none; border: 0; color: var(--muted); cursor: pointer;
  padding: 10px 14px; border-bottom: 3px solid transparent; margin-bottom: -2px; white-space: nowrap;
}
nav.tabs button[aria-current="page"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--brand); }
nav.tabs .lock { font-size: .75rem; margin-left: 4px; }

main.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(18px, 4vw, 32px); display: flex; flex-direction: column; gap: 20px; }

.journey { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.jstep { border: 2px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.jstep .n { font-family: var(--font-display); font-weight: 700; color: var(--brand); font-size: .85rem; letter-spacing: .06em; text-transform: uppercase; }
.jstep.done { border-color: var(--acordo); background: var(--acordo-soft); }
.jstep.now { border-color: var(--brand); }
.jstep .st { font-size: .85rem; font-weight: 700; color: var(--muted); }
.jstep.done .st { color: var(--acordo); }

form.stack, .stack { display: flex; flex-direction: column; gap: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label, .lbl { font-weight: 700; }
.field input, .field select, .field textarea {
  font: inherit; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); width: 100%;
}
.field textarea { min-height: 90px; resize: vertical; }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
legend { font-weight: 700; padding: 0; margin-bottom: 6px; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { position: relative; }
.choice input { position: absolute; opacity: 0; inset: 0; cursor: pointer; }
.choice label { display: inline-block; padding: 9px 15px; border: 2px solid var(--line); border-radius: 999px; cursor: pointer; background: var(--surface); }
.choice input:checked + label { border-color: var(--brand); background: var(--brand); color: var(--brand-ink); font-weight: 700; }
.choice input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }
.q-alert { border-left: 4px solid var(--alerta); padding-left: 14px; }
.check { display: flex; gap: 10px; align-items: flex-start; }
.check input { width: 22px; height: 22px; margin-top: 2px; flex: none; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { font: inherit; font-weight: 700; cursor: pointer; border-radius: 10px; padding: 11px 18px; border: 2px solid var(--brand); background: var(--brand); color: var(--brand-ink); text-decoration: none; display: inline-block; }
.btn.ghost { background: transparent; color: var(--brand); }
.btn.small { padding: 7px 12px; font-size: .9rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

.notice { border-radius: 12px; padding: 14px 16px; background: var(--brand-soft); display: flex; flex-direction: column; gap: 8px; }
.notice.warn { background: var(--processo-soft); }
.notice.ok { background: var(--acordo-soft); }
.note { border-left: 4px solid var(--brand); padding: 2px 0 2px 14px; }
.toast { color: var(--acordo); font-weight: 700; font-size: .95rem; }
.err { color: var(--alerta); font-weight: 700; font-size: .92rem; }

.turmas { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.turma { position: relative; }
.turma input { position: absolute; opacity: 0; inset: 0; }
.turma label { display: flex; flex-direction: column; gap: 4px; border: 2px solid var(--line); border-radius: 12px; padding: 14px; cursor: pointer; height: 100%; }
.turma input:checked + label { border-color: var(--brand); background: var(--brand-soft); }
.turma input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }
.turma input:disabled + label { opacity: .5; cursor: not-allowed; }
.turma .d { font-family: var(--font-display); font-weight: 700; }
.turma .v { font-size: .88rem; color: var(--muted); }
.part-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.selo-wrap { display: grid; grid-template-columns: minmax(0, 220px) 1fr; gap: 24px; align-items: center; }
.selo-wrap svg { width: 100%; max-width: 220px; height: auto; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 0; }

.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.opt { font: inherit; color: var(--ink); text-align: left; cursor: pointer; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.opt:hover { border-color: var(--brand); }
.opt strong { font-family: var(--font-display); font-size: 1rem; }
.opt span { color: var(--muted); font-size: .9rem; }
.opt .ico { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); font-weight: 700; }

.substeps ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.substeps li { display: flex; flex-direction: column; gap: 6px; font-size: .8rem; color: var(--muted); }
.substeps li::before { content: ""; height: 6px; border-radius: 3px; background: var(--line); }
.substeps li.done::before, .substeps li.current::before { background: var(--brand); }
.substeps li.current { color: var(--ink); font-weight: 700; }

.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.side { border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.side.processo { background: var(--processo-soft); } .side.processo h2 { color: var(--processo); }
.side.acordo { background: var(--acordo-soft); } .side.acordo h2 { color: var(--acordo); }
.side.interno { background: var(--interno-soft); } .side.interno h2 { color: var(--interno); }
.side h2 { font-size: 1.05rem; }
.side dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; }
.side dt { color: var(--muted); font-size: .88rem; padding-top: 2px; }
.side dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; min-width: 0; }
.side dd small { display: block; font-weight: 400; color: var(--muted); font-size: .85rem; }

.timebar { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 10px; font-size: .9rem; }
.bar-track { background: var(--bg); border-radius: 6px; height: 24px; position: relative; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 6px; display: flex; align-items: center; padding-left: 8px; font-weight: 700; font-size: .82rem; white-space: nowrap; min-width: 4px; color: var(--surface); }
.bar-fill.processo { background: var(--processo); } .bar-fill.acordo { background: var(--acordo); } .bar-fill.interno { background: var(--interno); }
.bar-out { position: absolute; top: 50%; transform: translateY(-50%); font-weight: 700; font-size: .82rem; }
.bar-out.acordo { color: var(--acordo); } .bar-out.interno { color: var(--interno); }

.danger { background: var(--alerta-soft); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.danger h2 { color: var(--alerta); }
.phones { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.phone { background: var(--surface); border-radius: 10px; padding: 12px; }
.phone b { font-family: var(--font-display); font-size: 1.5rem; display: block; }

.paths { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.path { border: 2px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.path.interno { border-color: var(--interno); } .path.acordo { border-color: var(--acordo); }

.comp-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px; }
.doc { background: #FFFFFF; color: #1A1A1A; border: 1px solid var(--line); border-radius: 6px; padding: clamp(18px, 4vw, 40px); font-family: Georgia, "Times New Roman", serif; font-size: .98rem; line-height: 1.6; display: flex; flex-direction: column; gap: 12px; }
.doc h2 { font-family: Georgia, serif; text-align: center; font-size: 1.1rem; letter-spacing: .04em; }
.doc h3 { font-family: Georgia, serif; font-size: .98rem; }
.doc table { border-collapse: collapse; width: 100%; font-size: .92rem; }
.doc th, .doc td { border: 1px solid #BBB; padding: 6px 8px; text-align: left; vertical-align: top; }
.doc .sig { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 28px 20px; margin-top: 18px; }
.doc .sig div { border-top: 1px solid #333; padding-top: 4px; font-size: .88rem; }

.table-scroll { overflow-x: auto; }
table.list { border-collapse: collapse; width: 100%; font-size: .93rem; }
table.list th, table.list td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.list th { font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
table.list td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { display: inline-block; font-size: .8rem; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill.interno { background: var(--interno-soft); color: var(--interno); }
.pill.acordo { background: var(--acordo-soft); color: var(--acordo); }
.pill.warn { background: var(--processo-soft); color: var(--processo); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.tile { background: var(--bg); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.tile b { font-family: var(--font-display); font-size: 1.7rem; font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: .88rem; }
.hbars { display: flex; flex-direction: column; gap: 8px; }
.hbar { display: grid; grid-template-columns: minmax(110px, 180px) 1fr 40px; gap: 10px; align-items: center; font-size: .9rem; }
.hbar .t { background: var(--bg); height: 18px; border-radius: 4px; overflow: hidden; }
.hbar .f { background: var(--brand); height: 100%; }
.hbar .v { font-variant-numeric: tabular-nums; text-align: right; font-weight: 700; }
.locked { text-align: left; display: flex; flex-direction: column; gap: 12px; }
.pessoa { border: 2px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.pessoa-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.confirma { background: var(--acordo-soft); border: 2px solid var(--acordo); color: var(--ink); border-radius: 12px; padding: 16px; font-family: var(--font-display); font-weight: 700; letter-spacing: .02em; text-align: center; }
.logo { display: block; height: 96px; width: auto; max-width: 100%; background: #FFFFFF; border-radius: 12px; padding: 4px 10px; }
footer { color: var(--muted); font-size: .84rem; text-align: center; }
@media (max-width: 520px) { .selo-wrap { grid-template-columns: 1fr; } .comp-row, .part-row { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { main.card { animation: in .2s ease-out; } @keyframes in { from { transform: translateY(5px); } to { transform: none; } } }
</style>

  outro:     { tag: "Outro", titulo: "Outro assunto", desc: "Descreva o conflito com suas palavras.", tema: "", dica: "Registre o que cada parte precisa e o que pode ser combinado, com prazo e responsável." }

/* ===== ESTADO ===== */
const KEY = "conviva-demo-v1";
const novo = () => ({ perfil: null, view: "inicio", condo: null, cap: null, selo: null, atend: [], seq: 0, sim: { step: 0, sit: null, r: {} }, cons: { step: 0, sit: null, r: {} }, ultimo: null });
const SAMPLE = (window.claude && window.claude.use) ? window.claude.use("sample").catch(() => null) : Promise.resolve(null);
let S = novo();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(novo(), JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const dt = iso => { const [y, m, d] = iso.split("-").map(Number); return new Date(y, m - 1, d); };
const fmt = d => d.toLocaleDateString("pt-BR");
const fmtLong = d => d.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long" });
const hoje = () => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); };
const maskCpf = v => { const d = v.replace(/\D/g, "").slice(0, 11); let o = d.slice(0, 3); if (d.length > 3) o += "." + d.slice(3, 6); if (d.length > 6) o += "." + d.slice(6, 9); if (d.length > 9) o += "-" + d.slice(9); return o; };
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;

const etapa = () => !S.condo ? 0 : !S.cap ? 1 : !S.selo ? 2 : 3;
const seloValido = () => S.selo && dt(S.selo.validade) >= hoje();

/* ===== NAVEGAÇÃO ===== */
const TABS = [
  ["inicio", "Início"], ["adesao", "Adesão"], ["capacitacao", "Capacitação"], ["selo", "Selo"],
  ["simulador", "Simulador"], ["acordos", "Atendimentos"]
];
const PERFIS = { condominio: "Condomínio / administradora", morador: "Consulta de morador", nupemec: "NUPEMEC / TJPE" };
function go(view) { S.view = view; save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }

function renderChrome() {
  const lockSim = !seloValido();
  const nav = document.getElementById("tabs");
  nav.parentElement.hidden = S.perfil !== "condominio";
  nav.innerHTML = TABS.map(([k, t]) => {
    const lock = (k === "simulador" || k === "acordos") && lockSim;
    return `<button data-tab="${k}" ${S.view === k ? 'aria-current="page"' : ""}>${t}${lock ? '<span class="lock" aria-label="bloqueado"> · bloqueado</span>' : ""}</button>`;
  }).join("");
  const cond = S.perfil === "condominio";
  document.getElementById("chips").innerHTML =
    `<span class="chip demo">Protótipo</span>` +
    (S.perfil ? `<span class="chip">${PERFIS[S.perfil]}</span>` : "") +
    (cond && S.condo ? `<span class="chip">${esc(S.condo.nome)}</span>` : "") +
    (cond && seloValido() ? `<span class="chip ok">Selo válido até ${fmt(dt(S.selo.validade))}</span>` : "") +
    (S.perfil ? `<button class="btn ghost small" id="trocar">Trocar perfil</button>` : "");
}

/* ===== ENTRADA ===== */
function viewEntrada() {
  return `<h1>Como você quer entrar?</h1>
  <p class="lead">O Conviva tem duas formas de acesso. A consulta é aberta a qualquer pessoa. Os modelos de termo e o encaminhamento ao CEJUSC são exclusivos de condomínios com o Selo Conviva.</p>
  <div class="paths">
    <div class="path interno"><h2>Condomínio ou administradora</h2>
      <p>Adesão ao programa, capacitação de mediadores, Selo Conviva, simulador completo, termo de acordo e encaminhamento ao CEJUSC.</p>
      <div class="actions"><button class="btn" data-perfil="condominio">Entrar como condomínio</button></div></div>
    <div class="path acordo"><h2>Morador(a): consulta rápida</h2>
      <p>Simulação simples e anônima: veja como costuma ser cada caminho para o conflito do seu condomínio. Nada é guardado nem enviado.</p>
      <div class="actions"><button class="btn" data-perfil="morador">Fazer uma consulta</button></div></div>
  </div>
  <p class="hint">Equipe do TJPE? <button class="btn ghost small" data-perfil="nupemec">Acesso NUPEMEC (painel do programa)</button></p>`;
}

/* ===== CONSULTA DO MORADOR ===== */
function viewConsulta() {
  const st = sim().step;
  if (st === 0) return subSteps(0) + `<h1>Qual é o problema no seu condomínio?</h1>
    <p class="lead">Consulta gratuita e anônima. Veja, antes de decidir, como costuma ser cada caminho.</p>${gradeAssuntos()}`;
  if (st === 1) return subSteps(1) + viewAtendimento();
  if (st === 2) return subSteps(2) + viewCaminhos();
  return subSteps(3) + viewOrientacao();
}
function viewOrientacao() {
  const int = podeInterno(), a = ASSUNTOS[sim().sit];
  return `${risco() ? protecao() : ""}<h1>O que você pode fazer</h1><div class="paths">
    ${int ? `<div class="path interno"><h2>Conversar no próprio condomínio</h2><p>Procure a administração. Se o condomínio tem o Selo Conviva, um mediador treinado pode conduzir a conversa e registrar o acordo em termo.</p>
      <p class="hint">O seu condomínio ainda não participa? Indique o Programa Conviva ao síndico.</p></div>` : ""}
    <div class="path acordo"><h2>Conciliação gratuita no CEJUSC</h2><p>${a.parte ? "Recomendável se você preferir uma pessoa de fora, já que o condomínio é parte do conflito." : "Se preferir uma pessoa de fora do condomínio, ou se não houver acordo."} Não precisa de advogado nem de processo.</p></div>
    <div class="path"><h2>Defensoria Pública</h2><p>Orientação jurídica gratuita para quem não pode pagar advogado.</p></div>
  </div>
  <p class="hint">Esta consulta não faz encaminhamentos nem guarda informações.</p>
  <div class="actions"><button class="btn ghost" data-sstep="2">Voltar aos caminhos</button><button class="btn" id="nova-consulta">Fazer outra consulta</button></div>`;
}
function gradeAssuntos() {
  return `<div class="options">${Object.entries(ASSUNTOS).map(([k, a]) => `<button class="opt" data-sit="${k}"><span class="ico">${a.tag}${a.parte ? " · envolve o condomínio" : ""}</span><strong>${a.titulo}</strong><span>${a.desc}</span></button>`).join("")}</div>`;
}

      <div class="field"><label for="a-tel">Telefone</label><input id="a-tel" inputmode="tel" required></div>
      <div class="field"><label for="a-data">Data da assembleia</label><input id="a-data" type="date" required></div>
    </div>

/* ===== CAPACITAÇÃO ===== */
function viewCapacitacao() {
  if (!S.condo) return locked("Faça a adesão do condomínio antes de agendar a capacitação.", "adesao", "Fazer a adesão");
  if (S.cap) {
    const t = TURMAS.find(x => x.id === S.cap.turma);
    return `<h1>Capacitação agendada</h1>
    <dl class="kv"><dt>Turma</dt><dd>${fmtLong(dt(t.data))} · ${t.hora}</dd><dt>Formato</dt><dd>${t.formato}</dd><dt>Pessoas</dt><dd>${S.cap.pessoas.length}</dd></dl>
    <div class="table-scroll"><table class="list"><thead><tr><th>Nome</th><th>Função no condomínio</th></tr></thead><tbody>
    ${S.cap.pessoas.map(p => `<tr><td>${esc(p.nome)}</td><td>${esc(p.funcao)}</td></tr>`).join("")}</tbody></table></div>
    ${S.selo ? `<div class="notice ok"><p>Capacitação concluída. Selo emitido.</p></div><div class="actions"><button class="btn" data-go="selo">Ver o selo</button></div>`
      : `<div class="notice warn"><p><strong>Após a capacitação</strong>, o NUPEMEC confirma a participação e o selo é emitido automaticamente.</p>
         <div class="actions"><button class="btn" id="concluir">Simular conclusão da capacitação (NUPEMEC)</button><button class="btn ghost" id="remarcar">Remarcar</button></div></div>`}`;
  }
  const n = S.capDraft?.n || 2;
  return `<h1>Agende a capacitação</h1>
  <p class="lead">Escolha uma turma e indique quem será treinado para mediar no condomínio. Até ${CONFIG.maxTreinandos} pessoas por condomínio.</p>
  <form id="f-cap" class="stack" novalidate>
    <fieldset><legend>Turmas disponíveis</legend><div class="turmas">
    ${TURMAS.map(t => { const livres = t.vagas - t.ocupadas; return `<div class="turma">
      <input type="radio" name="turma" id="tu-${t.id}" value="${t.id}" ${livres <= 0 ? "disabled" : ""} ${S.capDraft?.turma === t.id ? "checked" : ""}>
      <label for="tu-${t.id}"><span class="d">${fmtLong(dt(t.data))}</span><span>${t.hora} · ${t.formato}</span>
      <span class="v">${livres <= 0 ? "Turma lotada" : `${livres} vagas`}</span></label></div>`; }).join("")}
    </div></fieldset>
    <div class="field" style="max-width:260px"><label for="c-n">Quantas pessoas serão treinadas?</label>
      <input id="c-n" type="number" min="1" max="${CONFIG.maxTreinandos}" value="${n}"></div>
    <div class="stack" id="c-pessoas">${pessoasFields(n)}</div>
    <p class="hint">Sugestão: síndico(a), subsíndico(a), conselheiros ou moradores para uma comissão de convivência.</p>
    <p class="err" id="c-err" hidden></p>
    <div class="actions"><button class="btn" type="submit">Confirmar agendamento</button></div>
  </form>`;
}
function pessoasFields(n) {
  const old = S.capDraft?.pessoas || [];
  return Array.from({ length: n }, (_, i) => `<div class="part-row">
    <div class="field"><label for="p-n${i}">Pessoa ${i + 1} · nome</label><input id="p-n${i}" value="${esc(old[i]?.nome)}"></div>
    <div class="field"><label for="p-f${i}">Função no condomínio</label><select id="p-f${i}">
      ${["Síndico(a)", "Subsíndico(a)", "Conselheiro(a)", "Comissão de convivência", "Morador(a) voluntário(a)"].map(f => `<option ${old[i]?.funcao === f ? "selected" : ""}>${f}</option>`).join("")}
    </select></div></div>`).join("");
}

/* ===== SELO ===== */
function seloSvg() {
  const nome = esc(S.condo.nome.length > 26 ? S.condo.nome.slice(0, 25) + "…" : S.condo.nome);
  return `<svg viewBox="0 0 220 220" role="img" aria-label="Selo Conviva">
    <circle cx="110" cy="110" r="104" fill="var(--brand)"/>
    <circle cx="110" cy="110" r="92" fill="none" stroke="var(--ouro)" stroke-width="3" stroke-dasharray="4 5"/>
    <circle cx="110" cy="110" r="78" fill="var(--surface)"/>
    <path d="M78 122V100l18-15 18 15v22M114 122v-17l13-10 13 10v17M72 122h76" stroke="var(--brand)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="110" y="70" text-anchor="middle" font-family="Sora, sans-serif" font-weight="700" font-size="17" fill="var(--brand)">CONVIVA</text>
    <text x="110" y="143" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-size="10" fill="var(--ink)">${nome}</text>
    <text x="110" y="160" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-weight="700" font-size="10" fill="var(--ouro)">VÁLIDO ATÉ ${fmt(dt(S.selo.validade))}</text>
  </svg>`;
}
function viewSelo() {
  if (!S.condo) return locked("O selo é emitido depois da adesão e da capacitação.", "adesao", "Fazer a adesão");
  if (!S.selo) return locked("O selo é emitido quando o NUPEMEC confirma a capacitação.", "capacitacao", "Ver capacitação");
  const vence = dt(S.selo.validade), dias = Math.round((vence - hoje()) / 864e5);
  return `<h1>Selo Conviva</h1>
  <div class="selo-wrap">${seloSvg()}
    <div class="stack"><dl class="kv"><dt>Número</dt><dd>${S.selo.numero}</dd><dt>Condomínio</dt><dd>${esc(S.condo.nome)}</dd>
      <dt>Emissão</dt><dd>${fmt(dt(S.selo.emissao))}</dd><dt>Validade</dt><dd>${fmt(vence)} (${CONFIG.seloAnos} anos)</dd>
      <dt>Mediadores</dt><dd>${S.cap.pessoas.map(p => esc(p.nome)).join(", ")}</dd></dl>
      ${dias <= 90 ? `<div class="notice warn"><p>O selo vence em ${dias} dias. Agende uma nova capacitação para renovar.</p></div>` : ""}
      <p class="hint">Com o selo válido, os mediadores do condomínio têm acesso ao simulador e à emissão de termos de acordo.</p>
      <div class="actions"><button class="btn" data-go="simulador">Abrir o simulador</button></div></div>
  </div>`;
}

function locked(msg, to, label) {
  return `<div class="locked"><h1>Etapa ainda não liberada</h1><p class="lead">${msg}</p><div class="actions"><button class="btn" data-go="${to}">${label}</button></div></div>`;
}

/* ===== SIMULADOR ===== */
const consulta = () => S.perfil === "morador";
const sim = () => consulta() ? S.cons : S.sim;
function choiceGroup(name, legend, opts, hint, alert) {
  const v = sim().r[name];
  return `<fieldset class="${alert ? "q-alert" : ""}"><legend>${legend}</legend>${hint ? `<p class="hint">${hint}</p>` : ""}
    <div class="choices">${opts.map((o, i) => `<span class="choice"><input type="radio" id="${name}-${i}" name="${name}" value="${o[0]}" ${v === o[0] ? "checked" : ""}><label for="${name}-${i}">${o[1]}</label></span>`).join("")}</div></fieldset>`;
}
function subSteps(i) {
  return `<nav class="substeps" aria-label="Etapas do atendimento"><ol>${(consulta() ? ["Assunto", "Perguntas", "Caminhos", "Orientação"] : ["Assunto", "Atendimento", "Caminhos", "Encaminhar"]).map((t, k) => `<li class="${k < i ? "done" : k === i ? "current" : ""}">${t}</li>`).join("")}</ol></nav>`;
}
function viewSimulador() {
  if (!seloValido()) return locked(S.selo ? "O selo do condomínio venceu. Renove a capacitação para voltar a usar o simulador." : "O simulador é liberado para condomínios com o Selo Conviva válido.", S.condo ? (S.cap ? "selo" : "capacitacao") : "adesao", "Ver o que falta");
  const st = sim().step;
  if (st === 0) return subSteps(0) + `<h1>Qual é o assunto do conflito?</h1>
    <p class="lead">Use durante o atendimento, com as partes. Se não encontrar o assunto, escolha "Outro assunto".</p>${gradeAssuntos()}`;
  if (st === 1) return subSteps(1) + viewAtendimento();
  if (st === 2) return subSteps(2) + viewCaminhos();
  if (st === 3) return subSteps(3) + viewEncaminhar();
  if (st === 4) return subSteps(3) + viewTermoForm();
  return subSteps(3) + viewTermoEmitido();
}

function viewAtendimento() {
  const s = sim().sit, a = ASSUNTOS[s], r = sim().r;
  const p = (k, ph) => `<input id="${k}" value="${esc(r[k])}" placeholder="${ph}">`;
  let q = "";
  if (s === "outro") q += `<div class="field"><label for="outroTxt">Descreva o assunto</label>${p("outroTxt", "Ex.: uso de bicicletas no hall")}</div>`;
  q += consulta()
    ? choiceGroup("papel", "Você é…", a.parte
        ? [["morador", "Morador(a)"], ["adm", "Síndico(a) ou administração"]]
        : [["afetado", "Quem está sendo afetado(a)"], ["apontado", "Quem recebeu a reclamação"]])
    : choiceGroup("papel", "Quem procurou o atendimento?", a.parte
        ? [["morador", "Morador(a)"], ["adm", "Administração do condomínio"]]
        : [["afetado", "Morador(a) afetado(a)"], ["apontado", "Morador(a) que recebeu a reclamação"], ["adm", "Administração do condomínio"]]);
  q += choiceGroup("tentou", "Já houve tentativa de resolver? (opcional)", [["nao", "Ainda não"], ["conversa", "Conversaram, sem sucesso"], ["advertencia", "Já houve advertência ou multa"]]);
  q += choiceGroup("conversa", "As partes ainda conseguem conversar?", [["sim", "Sim"], ["dificil", "Com dificuldade"], ["nao", "Não"]]);
  q += choiceGroup("violencia", "Existe ameaça, agressão ou medo de ficar perto da outra parte?", [["nao", "Não"], ["sim", "Sim"]], "Se sim, o Conviva mostra os canais de proteção e os cuidados para a mediação.", true);
  if (!consulta()) q += `<h3>Partes (opcional nesta etapa)</h3><div class="grid2">
    <div class="field"><label for="p1nome">Parte 1 · nome</label>${p("p1nome", "")}</div><div class="field"><label for="p1uni">Parte 1 · unidade</label>${p("p1uni", a.parte ? "Ex.: Bloco A, 302" : "Ex.: 302")}</div>
    <div class="field"><label for="p2nome">Parte 2 · nome</label>${p("p2nome", a.parte ? "Condomínio " + (S.condo?.nome || "") : "")}</div><div class="field"><label for="p2uni">Parte 2 · unidade</label>${p("p2uni", a.parte ? "Administração" : "Ex.: 402")}</div></div>`;
  q += blocoPessoas();
  return `<h1>${a.titulo}</h1><p class="lead">${consulta() ? "Algumas perguntas rápidas. Nada é guardado nem enviado." : "Registre o atendimento. As informações ficam só no condomínio."}</p>
    <form id="f-at" class="stack" novalidate>${q}
    <div class="actions"><button type="button" class="btn ghost" data-sstep="0">Voltar</button><button type="submit" class="btn" id="ver">Ver os caminhos</button></div></form>`;
}
const VINCULOS = { menor: ["Mãe", "Pai", "Responsável legal"], idoso: ["A própria pessoa idosa", "Filho(a)", "Neto(a)", "Cuidador(a)", "Outro familiar"] };
function blocoPessoas() {
  const lista = sim().r.pessoas || [];
  const campo = (i, f, rot, v, extra) => `<div class="field"><label for="pi${i}-${f}">${rot}</label>${extra === "area"
    ? `<textarea id="pi${i}-${f}" data-pi="${i}" data-pf="${f}">${esc(v)}</textarea>`
    : `<input id="pi${i}-${f}" data-pi="${i}" data-pf="${f}" value="${esc(v)}" ${extra || ""}>`}</div>`;
  const cards = lista.map((p, i) => {
    const m = p.tipo === "menor";
    return `<div class="pessoa"><div class="pessoa-top"><h3>${m ? "Menor de idade" : "Pessoa idosa vítima da situação"}</h3><button type="button" class="btn ghost small" data-delp="${i}">Remover</button></div>
      <p class="hint">${m ? "O relato de criança ou adolescente (menos de 18 anos) é trazido por pai, mãe ou responsável legal." : "Pessoa com 60 anos ou mais que sofre a situação. O relato pode ser dela, de um familiar ou do cuidador."}</p>
      <div class="grid2">
        ${campo(i, "nome", m ? "Nome do menor" : "Nome da pessoa idosa", p.nome)}
        ${campo(i, "idade", "Idade", p.idade, 'type="number" min="0" max="120" inputmode="numeric"')}
        ${campo(i, "unidade", "Unidade", p.unidade)}
        ${campo(i, "resp", m ? "Pai, mãe ou responsável que traz o relato" : "Quem traz o relato", p.resp)}
        <div class="field"><label for="pi${i}-vinculo">Vínculo</label><select id="pi${i}-vinculo" data-pi="${i}" data-pf="vinculo"><option value="">Selecione</option>${VINCULOS[p.tipo].map(o => `<option ${p.vinculo === o ? "selected" : ""}>${o}</option>`).join("")}</select></div>
      </div>
      ${campo(i, "relato", "Relato do que aconteceu", p.relato, "area")}</div>`;
  }).join("");
  return `<h3>Adicionar pessoas (opcional)</h3>
    <p class="hint">Pais e responsáveis podem trazer o relato de um menor de idade. Também é possível incluir uma pessoa idosa que é vítima da situação.</p>
    ${cards}
    <div class="actions"><button type="button" class="btn ghost" data-addp="menor">+ Adicionar menor de idade</button><button type="button" class="btn ghost" data-addp="idoso">+ Adicionar pessoa idosa vítima</button></div>`;
}
function pessoasDoc(a) {

  return `<p><strong>Outras pessoas envolvidas no relato</strong></p><table><tr><th>Situação</th><th>Nome</th><th>Idade</th><th>Quem traz o relato</th><th>Vínculo</th><th>Unidade</th></tr>
  ${a.pessoas.map(p => `<tr><td>${p.tipo === "menor" ? "Menor de idade" : "Pessoa idosa vítima"}</td><td>${esc(p.nome)}</td><td>${esc(p.idade)}</td><td>${esc(p.resp)}</td><td>${esc(p.vinculo)}</td><td>${esc(p.unidade)}</td></tr>${p.relato ? `<tr><td colspan="6">Relato: ${esc(p.relato)}</td></tr>` : ""}`).join("")}</table>`;

function pessoasTexto(a) {

}
const MSG_CEJUSC = "SEU TERMO FOI ENVIADO PARA A CEJUSC APÓS A FINALIZAÇÃO PELO CONDOMÍNIO";
const confirmacao = () => `<div class="confirma" role="status">${MSG_CEJUSC}</div>`;

const risco = () => sim().r.violencia === "sim";

      <dt>Condições</dt><dd>Pagamento combinado entre as partes<small>sem honorários judiciais</small></dd>

    acc = `<dt>Tempo</dt><dd>cerca de ${sem} semanas</dd><dt>Custo</dt><dd>Gratuito</dd>

      ${risco() ? `<dt>Segurança</dt><dd>Só com segurança garantida<small>o CEJUSC pode ouvir cada parte separadamente</small></dd>` : ""}`;

  return `${risco() ? protecao() : ""}<h1>Caminhos possíveis</h1>
  <p class="lead">${esc(tituloAt())}: médias de casos parecidos, para as partes decidirem com informação.</p>

    ${int ? `<div class="bar-row"><span>Condomínio</span><div class="bar-track"><div class="bar-fill interno" style="width:${iw}%"></div><span class="bar-out interno" style="left:calc(${iw}% + 8px)">cerca de ${DADOS.internoSemanas} semana</span></div></div>` : ""}
  </div>
  <div class="compare">
    <section class="side processo"><h2>Processo na Justiça</h2><dl>${proc}<dt>Quem decide</dt><dd>O juiz</dd></dl></section>
    <section class="side acordo"><h2>Conciliação no CEJUSC</h2><dl>${acc}<dt>Quem decide</dt><dd>As partes<small>acordo homologado vale como sentença</small></dd></dl></section>
    ${int ? `<section class="side interno"><h2>Mediação no condomínio</h2><dl><dt>Tempo</dt><dd>cerca de ${DADOS.internoSemanas} semana</dd><dt>Custo</dt><dd>Gratuito</dd>
      <dt>Quem media</dt><dd>Mediador(a) Conviva<small>${consulta() ? "se o condomínio tiver o Selo Conviva" : a.parte ? "sem vínculo com a administração" : "sem interesse no caso"}</small></dd><dt>Registro</dt><dd>Termo de acordo<small>com 2 testemunhas, é título executivo; pode ser homologado no CEJUSC</small></dd>${risco() ? `<dt>Segurança</dt><dd>Conversas separadas, se preciso<small>pode ser interrompida a qualquer momento</small></dd>` : ""}</dl></section>` : ""}
  </div>
  ${a.parte && podeInterno() ? `<p class="note">Neste assunto, o próprio condomínio é parte do conflito. A mediação interna é possível, mas deve ser conduzida por um(a) mediador(a) Conviva sem vínculo com a administração, como um conselheiro ou membro da comissão de convivência. Se o morador preferir alguém de fora, o caminho é o CEJUSC.</p>` : ""}
  ${a.dica ? `<p class="note">${a.dica}</p>` : ""}
  <p class="hint">Médias de referência, não promessa de resultado. As partes sempre podem procurar a Justiça ou a Defensoria Pública. <strong>No protótipo, todos os números são exemplos.</strong></p>
  <div class="actions"><button class="btn ghost" data-sstep="1">Mudar respostas</button><button class="btn" data-sstep="3">${consulta() ? "O que eu posso fazer?" : "Escolher o encaminhamento"}</button></div>`;
}

  if (!seloValido()) return locked("Os atendimentos ficam disponíveis com o Selo Conviva válido.", S.condo ? (S.cap ? "selo" : "capacitacao") : "adesao", "Ver o que falta");
  if (!S.atend.length) return `<h1>Atendimentos</h1><p class="lead">Nenhum atendimento registrado ainda. Cada termo emitido e cada encaminhamento ao CEJUSC aparecem aqui.</p>
    <div class="actions"><button class="btn" data-go="simulador">Iniciar um atendimento</button></div>`;
  const viewing = S.atend.find(x => x.id === S.vendo);
  return `<h1>Atendimentos</h1><p class="lead">Registro do condomínio, de acesso restrito à administração.</p>
  <div class="table-scroll"><table class="list"><thead><tr><th>Nº</th><th>Data</th><th>Assunto</th><th>Unidades</th><th>Caminho</th><th>Situação</th><th></th></tr></thead><tbody>
  ${S.atend.slice().reverse().map(a => `<tr><td class="num">${a.numero}</td><td class="num">${fmt(dt(a.data))}</td><td>${esc(a.sit === "outro" ? a.outroTxt : ASSUNTOS[a.sit].titulo)}</td>
    <td>${esc([a.p1uni, a.p2uni].filter(Boolean).join(" × ") || "—")}</td>
    <td><span class="pill ${a.caminho === "termo" ? "interno" : "acordo"}">${a.caminho === "termo" ? "Mediação no condomínio" : "CEJUSC"}</span></td>
    <td>${a.caminho === "termo" ? `<label class="hint" for="sit-${a.id}" style="position:absolute;left:-9999px">Situação</label><select id="sit-${a.id}" data-sit-id="${a.id}">
      ${["Em acompanhamento", "Cumprido", "Descumprido · encaminhar ao CEJUSC"].map(o => `<option ${a.status === o ? "selected" : ""}>${o}</option>`).join("")}</select>` : `<span class="pill warn">Encaminhado</span>`}</td>
    <td>${a.caminho === "termo" ? `<button class="btn ghost small" data-ver="${a.id}">Ver termo</button>` : ""}</td></tr>`).join("")}
  </tbody></table></div>
  ${viewing ? confirmacao() + termoHtml(viewing) : ""}`;
}

/* ===== PAINEL TJPE ===== */
function viewPainel() {
  const proprios = S.atend.length, termos = S.atend.filter(a => a.caminho === "termo").length;
  const base = { cond: 48, cap: 31, med: 74, at: 126, ac: 98, cej: 19 };
  const extra = S.selo ? 1 : 0;
  const porAssunto = [["Barulho", 41], ["Vazamento ou infiltração", 22], ["Garagem e vagas", 18], ["Animais", 14], ["Taxa atrasada", 12], ["Áreas comuns", 9], ["Outros", 10]];
  const max = Math.max(...porAssunto.map(x => x[1]));
  return `<h1>Painel do programa</h1><p class="lead">Visão do TJPE/NUPEMEC sobre o Conviva. <strong>Números de exemplo</strong>, somados aos registros desta demonstração.</p>
  <div class="tiles">
    <div class="tile"><b>${base.cond + (S.condo ? 1 : 0)}</b><span>condomínios aderidos</span></div>
    <div class="tile"><b>${base.cap + extra}</b><span>com selo válido</span></div>
    <div class="tile"><b>${base.med + (S.selo ? S.cap.pessoas.length : 0)}</b><span>mediadores treinados</span></div>
    <div class="tile"><b>${base.at + proprios}</b><span>atendimentos</span></div>
    <div class="tile"><b>${base.ac + termos}</b><span>acordos no condomínio</span></div>
    <div class="tile"><b>${base.cej + proprios - termos}</b><span>encaminhados ao CEJUSC</span></div>
  </div>
  <section class="stack"><h2>Atendimentos por assunto</h2><div class="hbars">
    ${porAssunto.map(([t, v]) => `<div class="hbar"><span>${t}</span><div class="t"><div class="f" style="width:${v / max * 100}%"></div></div><span class="v">${v}</span></div>`).join("")}</div></section>
  <section class="stack"><h2>Turmas de capacitação</h2><div class="table-scroll"><table class="list"><thead><tr><th>Data</th><th>Horário</th><th>Formato</th><th>Ocupação</th></tr></thead><tbody>
    ${TURMAS.map(t => { const occ = t.ocupadas + (S.cap?.turma === t.id ? S.cap.pessoas.length : 0); return `<tr><td class="num">${fmt(dt(t.data))}</td><td>${t.hora}</td><td>${t.formato}</td><td class="num">${Math.min(occ, t.vagas)}/${t.vagas}</td></tr>`; }).join("")}
  </tbody></table></div></section>`;
}

/* ===== RENDER E EVENTOS ===== */
function render() {
  renderChrome();
  const V = { inicio: viewInicio, adesao: viewAdesao, capacitacao: viewCapacitacao, selo: viewSelo, simulador: viewSimulador, acordos: viewAcordos, painel: viewPainel };
  app.innerHTML = !S.perfil ? viewEntrada()
    : S.perfil === "morador" ? viewConsulta()
    : S.perfil === "nupemec" ? viewPainel()
    : (V[S.view] || viewInicio)();
  bind();
}

function bind() {
  document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => go(b.dataset.tab));
  app.querySelectorAll("[data-perfil]").forEach(b => b.onclick = () => { S.perfil = b.dataset.perfil; if (S.perfil === "condominio") S.view = "inicio"; save(); render(); });
  const tr = document.getElementById("trocar");
  if (tr) tr.onclick = () => { S.perfil = null; save(); render(); };
  const so = document.getElementById("seg-ok");
  if (so) so.onchange = () => { document.getElementById("btn-termo").disabled = !so.checked; };
  const nc = document.getElementById("nova-consulta");
  if (nc) nc.onclick = () => { S.cons = { step: 0, sit: null, r: {} }; save(); render(); };
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go(b.dataset.go));
  app.querySelectorAll("[data-sstep]").forEach(b => b.onclick = () => { sim().step = +b.dataset.sstep; save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); });
  app.querySelectorAll("[data-sit]").forEach(b => b.onclick = () => { if (sim().sit !== b.dataset.sit) sim().r = {}; sim().sit = b.dataset.sit; sim().step = 1; save(); render(); });

  const demo = document.getElementById("demo");
  if (demo) demo.onclick = () => {
    S.condo = { nome: "Condomínio Residencial Jardim das Mangueiras", cnpj: "12.345.678/0001-90", endereco: "Rua das Mangueiras, 120, Boa Viagem, Recife", unidades: "64",
      sindico: "Ana Beatriz Souza", email: "sindico@jardimdasmangueiras.com.br", telefone: "(81) 99999-0000", ata: "ata-assembleia-adesao-conviva.pdf", dataAta: "2026-10-30", dataAdesao: isoOf(hoje()) };
    save(); go("capacitacao");
  };

  const fa = document.getElementById("f-adesao");
  if (fa) fa.onsubmit = e => {
    e.preventDefault();
    const v = id => document.getElementById(id).value.trim();
    const file = document.getElementById("a-ata").files[0];
    const err = document.getElementById("a-err");
    const falta = [["a-nome", "nome"], ["a-cnpj", "CNPJ"], ["a-end", "endereço"], ["a-uni", "unidades"], ["a-sin", "síndico"], ["a-email", "e-mail"], ["a-tel", "telefone"], ["a-data", "data da assembleia"]].filter(([id]) => !v(id)).map(x => x[1]);
    if (!file) falta.push("ata da assembleia");
    if (!document.getElementById("a-ok").checked) falta.push("declaração");
    if (falta.length) { err.textContent = "Falta preencher: " + falta.join(", ") + "."; err.hidden = false; return; }
    S.condo = { nome: v("a-nome"), cnpj: v("a-cnpj"), endereco: v("a-end"), unidades: v("a-uni"), sindico: v("a-sin"), email: v("a-email"), telefone: v("a-tel"), ata: file.name, dataAta: v("a-data"), dataAdesao: isoOf(hoje()) };
    save(); go("capacitacao");
  };

  const fc = document.getElementById("f-cap");
  if (fc) {
    const readDraft = () => {
      const n = Math.min(CONFIG.maxTreinandos, Math.max(1, +document.getElementById("c-n").value || 1));
      const pessoas = Array.from({ length: n }, (_, i) => ({ nome: document.getElementById("p-n" + i)?.value.trim() || "", funcao: document.getElementById("p-f" + i)?.value || "Síndico(a)" }));
      S.capDraft = { turma: fc.querySelector("input[name=turma]:checked")?.value, n, pessoas };
    };
    document.getElementById("c-n").oninput = () => { readDraft(); document.getElementById("c-pessoas").innerHTML = pessoasFields(S.capDraft.n); };
    fc.onsubmit = e => {
      e.preventDefault(); readDraft();
      const d = S.capDraft, err = document.getElementById("c-err"), t = TURMAS.find(x => x.id === d.turma);
      let msg = "";
      if (!t) msg = "Escolha uma turma.";
      else if (d.pessoas.some(p => !p.nome)) msg = "Informe o nome de todas as pessoas que serão treinadas.";
      else if (d.n > t.vagas - t.ocupadas) msg = `Esta turma tem só ${t.vagas - t.ocupadas} vagas. Escolha outra turma ou reduza o número de pessoas.`;
      if (msg) { err.textContent = msg; err.hidden = false; return; }
      S.cap = { turma: d.turma, pessoas: d.pessoas }; S.capDraft = null; save(); render();
    };
  }
  const conc = document.getElementById("concluir");
  if (conc) conc.onclick = () => {
    const h = hoje(), v = new Date(h); v.setFullYear(v.getFullYear() + CONFIG.seloAnos);
    S.selo = { numero: `CONVIVA-${h.getFullYear()}-${String(49).padStart(4, "0")}`, emissao: isoOf(h), validade: isoOf(v) };
    save(); go("selo");
  };
  const rem = document.getElementById("remarcar");
  if (rem) rem.onclick = () => { S.capDraft = { turma: S.cap.turma, n: S.cap.pessoas.length, pessoas: S.cap.pessoas }; S.cap = null; save(); render(); };

  const fat = document.getElementById("f-at");
  if (fat) {
    const btn = document.getElementById("ver");
    const sync = () => {
      new FormData(fat).forEach((val, k) => { sim().r[k] = val; });
      fat.querySelectorAll("input:not([type=radio]):not([data-pi])").forEach(el => { sim().r[el.id] = el.value; });
      btn.disabled = !reqAtend(); save();
    };
    fat.addEventListener("input", sync); fat.addEventListener("change", sync); sync();
    fat.onsubmit = e => { e.preventDefault(); sync(); if (reqAtend()) { sim().step = 2; save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); } };
  }

  app.querySelectorAll("[data-addp]").forEach(b => b.onclick = () => { const r = sim().r; r.pessoas = r.pessoas || []; r.pessoas.push({ tipo: b.dataset.addp }); save(); render(); });
  app.querySelectorAll("[data-delp]").forEach(b => b.onclick = () => { sim().r.pessoas.splice(+b.dataset.delp, 1); save(); render(); });
  app.querySelectorAll("[data-pi]").forEach(el => { const hnd = () => { sim().r.pessoas[+el.dataset.pi][el.dataset.pf] = el.value; save(); }; el.addEventListener("input", hnd); el.addEventListener("change", hnd); });

  const cj = document.getElementById("cejusc");
  if (cj) cj.addEventListener("click", () => {
    if (cj.dataset.done) return;
    cj.dataset.done = "1";
    registrar("cejusc");
    const m = document.getElementById("cejusc-msg"); if (m) m.hidden = false;
  });

  const ft = document.getElementById("f-termo");
  if (ft) {
    const read = () => {
      const r = sim().r, g = id => document.getElementById(id).value.trim();
      ["p1nome", "p1cpf", "p1uni", "p2nome", "p2cpf", "p2uni", "mediador", "acomp", "resumo", "t1", "t2"].forEach(k => r[k] = g(k));
      r.comp = [0, 1, 2].map(i => ({ t: g(`c${i}t`), q: g(`c${i}q`), p: g(`c${i}p`) }));
      save();
    };
    ["p1cpf", "p2cpf"].forEach(id => { const el = document.getElementById(id); el.addEventListener("input", () => { el.value = maskCpf(el.value); }); });
    ft.addEventListener("input", read);

    const iaBtn = document.getElementById("ia-btn"), iaSt = document.getElementById("ia-status"), iaSug = document.getElementById("ia-sug");
    SAMPLE.then(s => { if (s && document.body.contains(iaBtn)) iaBtn.hidden = false; });
    iaBtn.onclick = async () => {
      read();
      const s = await SAMPLE; if (!s) return;
      const r = sim().r, idx = r.comp.map((x, i) => x.t ? i : -1).filter(i => i >= 0);
      if (!r.resumo && !idx.length) { iaSt.textContent = "Escreva o resumo ou um compromisso antes de revisar."; return; }
      iaBtn.disabled = true; iaSt.textContent = "Revisando o texto…"; iaSug.hidden = true;
      const prompt = `Você revisa textos de termos de acordo de convivência em condomínios residenciais no Brasil.
Reescreva o RESUMO e os COMPROMISSOS abaixo seguindo estas regras:
- linguagem simples e cordial, como uma conversa respeitosa entre vizinhos; sem juridiquês;
- tom neutro: não atribua culpa a ninguém e não use palavras de julgamento (por exemplo "abusivo", "desrespeitoso", "infrator", "culpado");
- descreva fatos e necessidades das duas partes (por exemplo "as partes relataram que…", "a unidade 302 precisa de silêncio à noite");
- resumo com no máximo 4 frases curtas que expliquem bem o conflito;
- cada compromisso deve ser uma ação concreta e clara; mantenha a mesma quantidade e a mesma ordem;
- não invente fatos, valores, prazos ou nomes; não inclua nomes de pessoas nem CPF: use "Parte 1", "Parte 2" ou o número das unidades.
Responda somente com JSON no formato {"resumo": "...", "compromissos": ["...", "..."]}.

ASSUNTO: ${tituloAt()}
RESUMO: ${r.resumo || "(vazio)"}
COMPROMISSOS:
${idx.map((i, k) => `${k + 1}. ${r.comp[i].t}`).join("\n") || "(nenhum)"}`;
      try {
        const out = await s.json(prompt, { modelTier: "default" });
        const res = typeof out?.resumo === "string" && out.resumo.trim() ? out.resumo.trim() : r.resumo;
        const comps = Array.isArray(out?.compromissos) ? out.compromissos : [];
        const sug = { resumo: res, comp: idx.map((i, k) => ({ i, t: String(comps[k] ?? r.comp[i].t).trim() })) };
        iaSug.innerHTML = `<h3>Sugestão de texto revisado</h3><p><strong>Resumo:</strong> ${esc(sug.resumo)}</p>
          ${sug.comp.length ? `<ol>${sug.comp.map(c => `<li>${esc(c.t)}</li>`).join("")}</ol>` : ""}
          <p class="hint">Leia com as partes antes de usar. A IA pode errar ou mudar o sentido.</p>
          <div class="actions"><button type="button" class="btn small" id="ia-usar">Usar texto revisado</button><button type="button" class="btn ghost small" id="ia-manter">Manter o meu</button></div>`;
        iaSug.hidden = false; iaSt.textContent = "";
        document.getElementById("ia-usar").onclick = () => {
          document.getElementById("resumo").value = sug.resumo;
          sug.comp.forEach(c => { document.getElementById(`c${c.i}t`).value = c.t; });
          read(); iaSug.hidden = true; iaSt.textContent = "Texto revisado aplicado. Você ainda pode editar.";
        };
        document.getElementById("ia-manter").onclick = () => { iaSug.hidden = true; iaSt.textContent = ""; };
      } catch (e) {
        const c = e && e.code;
        if (c === "not_granted") { iaBtn.hidden = true; iaSt.textContent = "A revisão com IA não foi autorizada nesta página."; }
        else if (c === "rate_limited") iaSt.textContent = "Muitas revisões em pouco tempo. Tente de novo em alguns minutos.";
        else iaSt.textContent = "Não foi possível revisar agora. O texto continua como você escreveu.";
      } finally { iaBtn.disabled = false; }
    };
    ft.onsubmit = e => {
      e.preventDefault(); read();
      const r = sim().r, err = document.getElementById("t-err");
      if (!r.p1nome || !r.p2nome || !r.comp.some(x => x.t)) { err.textContent = "Informe os nomes das duas partes e pelo menos um compromisso."; err.hidden = false; return; }
      if ([r.p1cpf, r.p2cpf].some(c => (c || "").replace(/\D/g, "").length !== 11)) { err.textContent = "Informe o CPF completo das duas partes (11 dígitos)."; err.hidden = false; return; }
      registrar("termo"); sim().step = 5; save(); render(); window.scrollTo({ top: 0, behavior: "smooth" });
    };
  }
  const ct = document.getElementById("copiar-termo");
  if (ct) ct.onclick = async () => {
    const a = S.atend.find(x => x.id === S.ultimo), msg = document.getElementById("copiar-msg");
    try { await navigator.clipboard.writeText(termoTexto(a)); msg.textContent = "Termo copiado."; }
    catch (e) { msg.textContent = "Não foi possível copiar automaticamente. Selecione o texto do termo e copie."; }
    msg.hidden = false;
  };
  const na = document.getElementById("novo-at");
  if (na) na.onclick = () => { S.sim = { step: 0, sit: null, r: {} }; save(); render(); };

  app.querySelectorAll("[data-sit-id]").forEach(s => s.onchange = () => { const a = S.atend.find(x => x.id === s.dataset.sitId); a.status = s.value; save(); });
  app.querySelectorAll("[data-ver]").forEach(b => b.onclick = () => { S.vendo = S.vendo === b.dataset.ver ? null : b.dataset.ver; save(); render(); });
}

function registrar(caminho) {
  const r = sim().r;
  S.seq += 1;
  const numero = `${String(S.seq).padStart(3, "0")}/${hoje().getFullYear()}`;
  const a = { id: "a" + Date.now(), numero, data: isoOf(hoje()), sit: sim().sit, outroTxt: r.outroTxt, caminho,
    p1nome: r.p1nome, p1cpf: r.p1cpf, p1uni: r.p1uni, p2nome: r.p2nome, p2cpf: r.p2cpf, p2uni: r.p2uni, mediador: r.mediador || S.cap?.pessoas[0]?.nome,
    resumo: r.resumo || "", comp: r.comp || [], risco: r.violencia === "sim", pessoas: JSON.parse(JSON.stringify((r.pessoas || []).filter(p => p.nome || p.relato))), acomp: r.acomp || isoOf(hoje()), t1: r.t1, t2: r.t2,
    status: caminho === "termo" ? "Em acompanhamento" : "Encaminhado" };
  S.atend.push(a); S.ultimo = a.id; save();
}

document.getElementById("reset").onclick = () => { S = novo(); save(); render(); };
render();
</script>

</body></html>
