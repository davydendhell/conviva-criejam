<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163b6b">
  <meta name="description" content="Conviva — simulador de caminhos para conflitos de condomínio.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/conviva.svg" type="image/svg+xml">
  <title>Conviva Simulador</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left)); background: #f4f6fa; color: #0f2440; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 1100px); margin: 0 auto; }
    .notice { margin: 0 0 1rem; padding: 1rem; border: 1px solid #d5dde9; border-radius: 12px; background: white; }
    h1 { margin: 0 0 .4rem; font-size: clamp(1.25rem, 4vw, 1.7rem); }
    p { margin: .25rem 0; }
    iframe { display: block; width: 100%; min-height: 92vh; border: 0; border-radius: 12px; background: white; }
    @media (max-width: 600px) { body { padding-inline: .5rem; } iframe { min-height: 96vh; } }
  </style>
</head>
<body>
  <main>
    <section class="notice">
      <h1>Conviva Simulador</h1>
      <p>Protótipo responsivo instalável. Abra uma vez com internet para habilitar o uso offline.</p>
      <p id="status" role="status">Carregando…</p>
    </section>
    <iframe id="simulador" title="Simulador Conviva"></iframe>
  </main>
  <script>
    const simulatorPath = './Conviva%20Simulador.html';
    fetch(simulatorPath).then(response => {
      if (!response.ok) throw new Error('Documento não encontrado');
      return response.text();
    }).then(html => {
      const base = `<base href="${new URL('./', location.href).href}">`;
      let source = html.replace(/<head([^>]*)>/i, match => `${match}${base}`);
      const enhancement = '<script src="./prototype-enhancements.js"></scr' + 'ipt>';
      source = source.replace(/<\/body>/i, enhancement + '</body>');
      document.getElementById('simulador').srcdoc = source;
      document.getElementById('status').textContent = 'Demonstração carregada com dados fictícios. Explore as etapas pelo menu ou pelos botões de demonstração.';
    }).catch(() => {
      document.getElementById('status').textContent = 'Falha ao carregar o simulador. Confira se “Conviva Simulador.html” está na raiz do repositório.';
    });
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('./sw.js').catch(() => {
        document.getElementById('status').textContent += ' Offline indisponível neste momento.';
      });
    }
  </script>
</body>
</html>
